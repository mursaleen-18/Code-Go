<!DOCTYPE html>
<html lang="en" data-theme="codego">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codego.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Go</title>
    <script>
      const savedTheme = localStorage.getItem("codego-theme");
      if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
